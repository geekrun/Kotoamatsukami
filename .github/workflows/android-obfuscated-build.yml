name: Android Obfuscated Build

on:
  push:
    branches: [ main, llvm-17-plugins ]
    paths:
      - 'android_example/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android-obfuscated-build.yml'
  pull_request:
    branches: [ main, llvm-17-plugins ]
    paths:
      - 'android_example/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android-obfuscated-build.yml'
  workflow_dispatch:

jobs:
  build-plugin:
    name: Build LLVM Plugin (x86_64)
    runs-on: ubuntu-24.04
    
    outputs:
      plugin-cache-key: ${{ steps.cache-plugin.outputs.cache-hit }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Cache LLVM Plugin
      id: cache-plugin
      uses: actions/cache@v4
      with:
        path: |
          bin/Kotoamatsukami.so
          compiler/Kotoamatsukami.config
        key: llvm-plugin-${{ runner.os }}-${{ hashFiles('src/**', 'CMakeLists.txt') }}
        restore-keys: |
          llvm-plugin-${{ runner.os }}-
    
    - name: Install LLVM-17 and dependencies
      if: steps.cache-plugin.outputs.cache-hit != 'true'
      run: |
        # 更新GPG密钥管理
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
        echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main" | sudo tee /etc/apt/sources.list.d/llvm-17.list
        sudo apt-get update
        sudo apt-get install -f -y
        
        # 安装构建依赖
        sudo apt-get install -y cmake ninja-build build-essential
        
        # 安装LLVM 17 - 支持Ubuntu 24.04
        sudo apt-get install -y \
          llvm-17 \
          llvm-17-dev \
          llvm-17-runtime \
          clang-17 || \
        sudo apt-get install -y \
          llvm-17 \
          llvm-17-dev \
          llvm-17-runtime \
          clang-17 \
          libllvm17t64
    
    - name: Build Plugin
      if: steps.cache-plugin.outputs.cache-hit != 'true'
      run: |
        mkdir -p build-ci-plugin
        cd build-ci-plugin
        
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER=clang++-17 \
          -DCMAKE_C_COMPILER=clang-17 \
          -DLLVM_DIR=/usr/lib/llvm-17/lib/cmake/llvm
        
        make -j$(nproc)
        
        # 检查插件文件
        if [ -f "libKotoamatsukami.so" ]; then
            SO_FILE="libKotoamatsukami.so"
        elif [ -f "Kotoamatsukami.so" ]; then
            SO_FILE="Kotoamatsukami.so"
        else
            echo "❌ Plugin build failed - no .so file found"
            ls -lh *.so 2>/dev/null || echo "No .so files found"
            exit 1
        fi
        
        # 复制到标准位置
        mkdir -p ../bin
        cp $SO_FILE ../bin/Kotoamatsukami.so
        
        echo "✅ Plugin built successfully: ../bin/Kotoamatsukami.so"
        ls -lh ../bin/Kotoamatsukami.so
        file ../bin/Kotoamatsukami.so
    
    - name: Upload Plugin Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kotoamatsukami-plugin
        path: |
          bin/Kotoamatsukami.so
          compiler/Kotoamatsukami.config

  build-android-obfuscated:
    name: Build Android APK (Obfuscated)
    runs-on: ubuntu-24.04
    needs: build-plugin
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Download Plugin Artifact
      uses: actions/download-artifact@v4
      with:
        name: kotoamatsukami-plugin
        path: .
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Install Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: '34.0.0'
        ndk-version: '26.3.11579264'
    
    - name: Install LLVM-17 for obfuscation
      run: |
        # 安装系统LLVM用于混淆第一阶段
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
        echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main" | sudo tee /etc/apt/sources.list.d/llvm-17.list
        sudo apt-get update
        sudo apt-get install -y clang-17 llvm-17
    
    - name: Verify Plugin and Config
      run: |
        echo "🔍 Verifying plugin and config files..."
        ls -lh bin/Kotoamatsukami.so
        file bin/Kotoamatsukami.so
        ls -lh compiler/Kotoamatsukami.config
        cat compiler/Kotoamatsukami.config | head -10
    
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Grant execute permission for gradlew
      run: chmod +x android_example/gradlew
    
    - name: Debug CI File Structure
      run: |
        echo "🔍 Checking CI file structure..."
        pwd
        ls -la
        echo "🔍 Checking plugin file..."
        ls -la bin/Kotoamatsukami.so || echo "❌ Plugin not found at bin/Kotoamatsukami.so"
        ls -la compiler/Kotoamatsukami.config || echo "❌ Config not found at compiler/Kotoamatsukami.config"
        echo "🔍 Full directory tree from root:"
        find . -name "Kotoamatsukami.so" -o -name "Kotoamatsukami.config"
    
    - name: Update CMakeLists.txt for Three-Stage IR Compilation
      run: |
        cd android_example/app/src/main/cpp
        
        # 实现基于IR中间阶段的三段式编译流程
        # Stage 1: NDK clang (source → LLVM IR)
        # Stage 2: Host opt + OLLVM plugin (IR → obfuscated IR)  
        # Stage 3: NDK clang (obfuscated IR → native objects)
        cat > CMakeLists.txt << 'CMAKEEOF'
        # Three-Stage IR-based OLLVM Obfuscation Pipeline
        # 基于IR中间阶段的三段式OLLVM混淆流水线
        # 避免插件直接加载到NDK clang进程，解决ABI兼容性问题
        
        cmake_minimum_required(VERSION 3.22.1)
        project("ollvm_demo")

        message(STATUS "🚀 Three-stage IR obfuscation compilation enabled")
        
        # 固定路径配置（CI环境）
        set(KOTOAMATSUKAMI_PLUGIN "/home/runner/work/Kotoamatsukami/Kotoamatsukami/bin/Kotoamatsukami.so")
        set(OBFUSCATION_CONFIG "/home/runner/work/Kotoamatsukami/Kotoamatsukami/compiler/Kotoamatsukami.config")
        set(HOST_OPT "opt-17")  # 主机LLVM 17 opt工具
        
        # 验证必要文件存在
        if(NOT EXISTS "\${KOTOAMATSUKAMI_PLUGIN}")
            message(FATAL_ERROR "❌ OLLVM plugin not found: \${KOTOAMATSUKAMI_PLUGIN}")
        endif()
        
        if(NOT EXISTS "\${OBFUSCATION_CONFIG}")
            message(FATAL_ERROR "❌ OLLVM config not found: \${OBFUSCATION_CONFIG}")
        endif()
        
        # 验证主机opt工具
        execute_process(COMMAND which "\${HOST_OPT}" OUTPUT_VARIABLE OPT_PATH OUTPUT_STRIP_TRAILING_WHITESPACE)
        if(OPT_PATH STREQUAL "")
            message(FATAL_ERROR "❌ Host opt tool not found: \${HOST_OPT}")
        endif()
        message(STATUS "✅ Using host opt: \${OPT_PATH}")
        
        # NDK工具链配置
        set(NDK_TARGET "aarch64-linux-android\${ANDROID_NATIVE_API_LEVEL}")
        set(NDK_CLANG "\${ANDROID_TOOLCHAIN_ROOT}/bin/\${NDK_TARGET}-clang++")
        
        message(STATUS "🔧 NDK Clang: \${NDK_CLANG}")
        message(STATUS "🎯 Target: \${NDK_TARGET}")
        message(STATUS "📁 Sysroot: \${ANDROID_SYSROOT}")
        
        # 源文件列表
        set(NATIVE_SOURCES "native-lib.cpp")
        set(OBFUSCATED_OBJECTS "")
        
        # 三阶段编译流水线
        foreach(SRC_FILE \${NATIVE_SOURCES})
            get_filename_component(BASE_NAME "\${SRC_FILE}" NAME_WE)
            message(STATUS "🔄 Processing \${SRC_FILE}...")
            
            # === 阶段1: 源码 → LLVM IR (NDK clang) ===
            set(STAGE1_IR_FILE "\${CMAKE_BINARY_DIR}/stage1_\${BASE_NAME}.ll")
            add_custom_command(
                OUTPUT "\${STAGE1_IR_FILE}"
                COMMAND "\${NDK_CLANG}"
                    -O0 -g
                    -fno-discard-value-names -S -emit-llvm
                    -target "\${NDK_TARGET}"
                    --sysroot "\${ANDROID_SYSROOT}"
                    -D__ANDROID_API__=\${ANDROID_NATIVE_API_LEVEL}
                    -DANDROID
                    -I"\${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
                    -I"\${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/aarch64-linux-android"
                    -I"\${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/c++/v1"
                    -stdlib=libc++
                    "\${CMAKE_CURRENT_SOURCE_DIR}/\${SRC_FILE}"
                    -o "\${STAGE1_IR_FILE}"
                DEPENDS "\${CMAKE_CURRENT_SOURCE_DIR}/\${SRC_FILE}"
                COMMENT "📝 Stage 1: NDK clang (\${SRC_FILE} → IR)"
            )
            
            # === 阶段2: IR → 混淆IR (主机opt + OLLVM插件) ===
            set(STAGE2_IR_FILE "\${CMAKE_BINARY_DIR}/stage2_\${BASE_NAME}.obf.bc")
            add_custom_command(
                OUTPUT "\${STAGE2_IR_FILE}"
                COMMAND env KOTOAMATSUKAMI_CONFIG="\${OBFUSCATION_CONFIG}"
                    "\${HOST_OPT}"
                    -load-pass-plugin="\${KOTOAMATSUKAMI_PLUGIN}"
                    -passes="gv-encrypt,sub,fla,bcf,split"
                    "\${STAGE1_IR_FILE}"
                    -o "\${STAGE2_IR_FILE}"
                DEPENDS "\${STAGE1_IR_FILE}" "\${KOTOAMATSUKAMI_PLUGIN}" "\${OBFUSCATION_CONFIG}"
                COMMENT "🔐 Stage 2: Host opt + OLLVM (IR → Obfuscated IR for \${BASE_NAME})"
            )
            
            # === 阶段3: 混淆IR → 目标文件 (NDK clang) ===
            set(STAGE3_OBJ_FILE "\${CMAKE_BINARY_DIR}/stage3_\${BASE_NAME}.o")
            add_custom_command(
                OUTPUT "\${STAGE3_OBJ_FILE}"
                COMMAND "\${NDK_CLANG}"
                    -O2 -fPIC -c -x ir
                    -target "\${NDK_TARGET}"
                    --sysroot "\${ANDROID_SYSROOT}"
                    "\${STAGE2_IR_FILE}"
                    -o "\${STAGE3_OBJ_FILE}"
                DEPENDS "\${STAGE2_IR_FILE}"
                COMMENT "🏗️ Stage 3: NDK clang (Obfuscated IR → Native object for \${BASE_NAME})"
            )
            
            list(APPEND OBFUSCATED_OBJECTS "\${STAGE3_OBJ_FILE}")
        endforeach()
        
        # 最终库构建
        add_library(\${CMAKE_PROJECT_NAME} SHARED \${OBFUSCATED_OBJECTS})
        set_target_properties(\${CMAKE_PROJECT_NAME} PROPERTIES LINKER_LANGUAGE CXX)
        
        # 链接Android系统库
        target_link_libraries(\${CMAKE_PROJECT_NAME} android log)
        
        message(STATUS "✅ Three-stage IR obfuscation pipeline configured")
        message(STATUS "   📝 Stage 1: NDK clang (Source → IR)")
        message(STATUS "   🔐 Stage 2: Host opt + OLLVM (IR → Obfuscated IR)")  
        message(STATUS "   🏗️ Stage 3: NDK clang (Obfuscated IR → Native object)")

        CMAKEEOF
        
        echo "✅ CMakeLists.txt updated for CI environment"
    
    - name: Build Obfuscated APK
      run: |
        cd android_example
        
        # 设置环境变量
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264
        export ANDROID_NDK=$ANDROID_NDK_HOME
        
        echo "🏗️ Building obfuscated Android APK..."
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
        
        # 构建Debug APK（启用混淆）
        ./gradlew assembleDebug --stacktrace --info
    
    - name: Verify Obfuscated APK
      run: |
        cd android_example
        
        # 检查APK是否生成
        APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
        if [ -f "$APK_PATH" ]; then
            echo "✅ Obfuscated APK built successfully!"
            ls -lh "$APK_PATH"
            
            # 提取并检查.so文件大小
            unzip -l "$APK_PATH" | grep "libollvm_demo.so" || echo "⚠️  .so file not found in APK"
            
            # 提取.so文件进行分析
            mkdir -p apk_analysis
            unzip "$APK_PATH" -d apk_analysis
            
            SO_FILE="apk_analysis/lib/arm64-v8a/libollvm_demo.so"
            if [ -f "$SO_FILE" ]; then
                echo "📊 Obfuscated .so file analysis:"
                ls -lh "$SO_FILE"
                file "$SO_FILE"
                echo "✅ Obfuscation likely successful - ready for reverse engineering analysis"
            else
                echo "❌ .so file not found in APK"
                find apk_analysis -name "*.so" -type f
            fi
        else
            echo "❌ APK build failed"
            exit 1
        fi
    
    - name: Upload Obfuscated APK
      uses: actions/upload-artifact@v4
      with:
        name: obfuscated-android-apk
        path: |
          android_example/app/build/outputs/apk/debug/app-debug.apk
          android_example/apk_analysis/lib/arm64-v8a/libollvm_demo.so
    
    - name: Upload Build Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: android-build-logs
        path: |
          android_example/app/.cxx/
          android_example/app/build/reports/
