name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 允许手动触发

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        arch: [x86_64, arm64]
        
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0  # 获取完整历史用于版本信息
        
    - name: Get version info
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION="dev-$(git describe --always --dirty)"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"
        
    - name: Setup advanced build cache
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/ccache
          ~/.cache/llvm
          build-${{ matrix.arch }}/CMakeFiles
          build-${{ matrix.arch }}/_deps
        key: release-cache-${{ matrix.arch }}-${{ steps.version.outputs.VERSION }}-${{ hashFiles('**/CMakeLists.txt', 'src/**') }}
        restore-keys: |
          release-cache-${{ matrix.arch }}-${{ steps.version.outputs.VERSION }}-
          release-cache-${{ matrix.arch }}-
          
    - name: Install build dependencies
      run: |
        # 安装ccache用于加速编译
        sudo apt-get update
        sudo apt-get install -y ccache patchelf
        
        # 安装LLVM-17
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo add-apt-repository "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main"
        sudo apt-get update
        sudo apt-get install -y \
          llvm-17 llvm-17-dev llvm-17-runtime \
          clang-17 lld-17 \
          cmake ninja-build
          
        # ARM64交叉编译工具链
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross
        fi
        
    - name: Configure ccache
      run: |
        ccache --set-config=cache_dir=~/.cache/ccache
        ccache --set-config=max_size=2G
        ccache --set-config=compression=true
        ccache --set-config=compression_level=6
        ccache --zero-stats
        
    - name: Build Release Version
      run: |
        export CC="ccache clang-17"
        export CXX="ccache clang++-17"
        
        mkdir -p build-${{ matrix.arch }}
        cd build-${{ matrix.arch }}
        
        if [ "${{ matrix.arch }}" = "x86_64" ]; then
          echo "Building x86_64 release..."
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG" \
            -DLLVM_DIR=/usr/lib/llvm-17/lib/cmake/llvm
        else
          echo "Building ARM64 release..."
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG" \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-gnu \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DLLVM_DIR=/usr/lib/llvm-17/lib/cmake/llvm
        fi
        
        # 编译
        time ninja -j$(nproc)
        
    - name: Strip and verify binary
      run: |
        cd build-${{ matrix.arch }}
        
        # 检查文件信息
        echo "=== Build Information ==="
        ls -lh Kotoamatsukami.so
        file Kotoamatsukami.so
        
        # 验证架构
        if [ "${{ matrix.arch }}" = "x86_64" ]; then
          file Kotoamatsukami.so | grep -q "x86-64" || (echo "❌ Wrong architecture" && exit 1)
        else
          file Kotoamatsukami.so | grep -q "aarch64" || (echo "❌ Wrong architecture" && exit 1)
        fi
        
        # 显示符号信息
        echo "=== Symbol Information ==="
        nm -D Kotoamatsukami.so | grep -E "(llvmGetPassPluginInfo|_Z)" | head -5
        
        # 创建最终发布文件
        cp Kotoamatsukami.so Kotoamatsukami-${{ matrix.arch }}-${{ steps.version.outputs.VERSION }}.so
        
    - name: Functional Test (x86_64 only)
      if: matrix.arch == 'x86_64'
      run: |
        cd build-${{ matrix.arch }}
        
        # 创建测试用例
        cat > android_jni_test.c << 'EOF'
        #include <jni.h>
        #include <string.h>

        static const char* secret_key = "MySecretAPIKey123456";
        static int global_counter = 0;

        JNIEXPORT jstring JNICALL
        Java_com_example_Native_getSecret(JNIEnv *env, jobject thiz) {
            global_counter++;
            char buffer[64];
            strcpy(buffer, secret_key);
            
            // 简单加密
            for(int i = 0; buffer[i]; i++) {
                buffer[i] ^= (global_counter & 0xFF);
            }
            
            return (*env)->NewStringUTF(env, buffer);
        }

        JNIEXPORT jint JNICALL
        Java_com_example_Native_calculate(JNIEnv *env, jobject thiz, jint a, jint b) {
            if (a > b) {
                return a * b + global_counter;
            } else {
                return (a + b) * global_counter;
            }
        }
        EOF
        
        # 生成LLVM IR
        clang-17 -S -emit-llvm -O1 android_jni_test.c -o android_jni_test.ll
        
        echo "=== Original IR size ==="
        wc -l android_jni_test.ll
        
        # 应用轻度混淆
        opt-17 --load-pass-plugin=./Kotoamatsukami.so \
          --passes="gv-encrypt,bogus-control-flow" \
          -S android_jni_test.ll -o android_jni_light.ll
          
        # 应用强度混淆
        opt-17 --load-pass-plugin=./Kotoamatsukami.so \
          --passes="gv-encrypt,bogus-control-flow,flatten,split-basic-block" \
          -S android_jni_test.ll -o android_jni_heavy.ll || true
        
        echo "=== Obfuscation Results ==="
        echo "Original:  $(wc -l < android_jni_test.ll) lines"
        echo "Light:     $(wc -l < android_jni_light.ll) lines"
        if [ -f android_jni_heavy.ll ]; then
          echo "Heavy:     $(wc -l < android_jni_heavy.ll) lines"
        fi
        
        # 编译验证
        clang-17 -shared -fPIC android_jni_light.ll -o libtest_light.so
        echo "✅ Light obfuscation test passed"
        
        if [ -f android_jni_heavy.ll ]; then
          clang-17 -shared -fPIC android_jni_heavy.ll -o libtest_heavy.so
          echo "✅ Heavy obfuscation test passed"
        fi
        
    - name: Show build stats
      run: |
        echo "=== CCache Statistics ==="
        ccache --show-stats
        
        echo "=== Final Build Size ==="
        ls -lh build-${{ matrix.arch }}/*.so
        
    - name: Upload release artifact
      uses: actions/upload-artifact@v3
      with:
        name: kotoamatsukami-${{ matrix.arch }}-release
        path: |
          build-${{ matrix.arch }}/Kotoamatsukami-${{ matrix.arch }}-${{ steps.version.outputs.VERSION }}.so
        retention-days: 90

  create-release:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      
    - name: Prepare release files
      run: |
        mkdir -p release
        find . -name "*.so" -exec cp {} release/ \;
        ls -la release/
        
        # 创建校验和
        cd release
        sha256sum *.so > SHA256SUMS.txt
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release/*
        body: |
          ## 🚀 Kotoamatsukami LLVM Pass Release ${{ github.ref_name }}
          
          ### 📦 Pre-built Binaries
          - **Kotoamatsukami-x86_64-*.so** - For x86_64/AMD64 systems
          - **Kotoamatsukami-arm64-*.so** - For ARM64/AArch64 systems (Android development)
          - **SHA256SUMS.txt** - File integrity checksums
          
          ### 🎯 For Android SO Obfuscation
          ```bash
          # 1. Generate ARM64 LLVM IR
          clang-17 --target=aarch64-linux-gnu -S -emit-llvm your_jni.c -o your_jni.ll
          
          # 2. Apply obfuscation
          opt-17 --load-pass-plugin=./Kotoamatsukami-arm64-*.so \
            --passes="gv-encrypt,bogus-control-flow,flatten" \
            -S your_jni.ll -o your_jni_obfuscated.ll
          
          # 3. Compile to ARM64 SO
          clang-17 --target=aarch64-linux-gnu -shared -fPIC \
            your_jni_obfuscated.ll -o libyour_jni_arm64.so -llog
          ```
          
          ### 🛡️ Available Obfuscation Techniques
          | Pass | Description | Performance Impact |
          |------|-------------|-------------------|
          | `gv-encrypt` | Global variable encryption | Low |
          | `bogus-control-flow` | Fake control flow | Medium |
          | `flatten` | Control flow flattening | High |
          | `split-basic-block` | Basic block splitting | Medium |
          | `substitution` | Instruction substitution | Medium |
          | `add-junk-code` | Junk code insertion | High |
          | `anti-debug` | Anti-debugging techniques | Low |
          
          ### 📋 Recommended Combinations
          - **Light**: `gv-encrypt,bogus-control-flow` (Fast compilation)
          - **Balanced**: `gv-encrypt,bogus-control-flow,flatten` (Good protection/speed)
          - **Heavy**: `gv-encrypt,bogus-control-flow,flatten,split-basic-block,substitution` (Maximum protection)
          
          ### ⚡ Performance Notes
          - Code size increase: 5-50x depending on passes used
          - Compilation time increase: 2-10x
          - Runtime performance impact: 10-50% depending on passes
          
          ---
          **Built with LLVM-17 • Optimized for Android NDK development**
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
