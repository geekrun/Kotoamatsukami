name: Build Kotoamatsukami LLVM Pass

on:
  push:
    branches: [ main, llvm-17-plugins ]
  pull_request:
    branches: [ main, llvm-17-plugins ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, arm64]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache LLVM and dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/llvm
          /usr/lib/llvm-17
          /usr/bin/*llvm*
          /usr/bin/*clang*
        key: llvm-17-${{ matrix.arch }}-${{ runner.os }}-v2
        restore-keys: |
          llvm-17-${{ matrix.arch }}-${{ runner.os }}-
          llvm-17-${{ runner.os }}-

    - name: Install LLVM-17 and base dependencies
      run: |
        # Add LLVM APT repository using modern method
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
        echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main" | sudo tee /etc/apt/sources.list.d/llvm-17.list
        
        # Update package list
        sudo apt-get update
        
        # Fix any broken packages first
        sudo apt-get install -f -y
        
        # Install base tools first
        sudo apt-get install -y cmake ninja-build build-essential
        
        # Install LLVM-17 with specific dependency resolution for Ubuntu 24.04
        sudo apt-get install -y \
          llvm-17 \
          llvm-17-dev \
          llvm-17-runtime \
          clang-17 || \
        sudo apt-get install -y \
          llvm-17 \
          llvm-17-dev \
          llvm-17-runtime \
          clang-17 \
          libllvm17t64

    - name: Install ARM64 cross-compilation tools
      if: matrix.arch == 'arm64'
      run: |
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          libc6-dev-arm64-cross

    - name: Configure build environment
      run: |
        # Set up environment variables
        echo "LLVM_DIR=/usr/lib/llvm-17/lib/cmake/llvm" >> $GITHUB_ENV
        echo "CC=clang-17" >> $GITHUB_ENV
        echo "CXX=clang++-17" >> $GITHUB_ENV

    - name: Build x86_64 version
      if: matrix.arch == 'x86_64'
      run: |
        mkdir -p build-x86_64
        cd build-x86_64
        
        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLVM_DIR=$LLVM_DIR \
          -DCMAKE_CXX_STANDARD=17
          
        ninja -j$(nproc)
        
        # Verify the plugin was built
        if [ -f "libKotoamatsukami.so" ]; then
          SO_FILE="libKotoamatsukami.so"
        elif [ -f "Kotoamatsukami.so" ]; then
          SO_FILE="Kotoamatsukami.so"
        else
          echo "未找到生成的SO文件"
          ls -lh *.so
          exit 1
        fi
        ls -lh $SO_FILE
        file $SO_FILE

    - name: Build ARM64 version
      if: matrix.arch == 'arm64'
      run: |
        mkdir -p build-arm64
        cd build-arm64
        
        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DCMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-gnu \
          -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
          -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
          -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
          -DLLVM_DIR=$LLVM_DIR
          
        ninja -j$(nproc)
        
        # Verify the ARM64 plugin was built
        if [ -f "libKotoamatsukami.so" ]; then
          SO_FILE="libKotoamatsukami.so"
        elif [ -f "Kotoamatsukami.so" ]; then
          SO_FILE="Kotoamatsukami.so"
        else
          echo "未找到生成的SO文件"
          ls -lh *.so
          exit 1
        fi
        ls -lh $SO_FILE
        file $SO_FILE

    - name: Test plugin loading
      if: matrix.arch == 'x86_64'
      run: |
        cd build-x86_64
        
        # Detect the SO file name
        if [ -f "libKotoamatsukami.so" ]; then
          SO_FILE="libKotoamatsukami.so"
        elif [ -f "Kotoamatsukami.so" ]; then
          SO_FILE="Kotoamatsukami.so"
        else
          echo "未找到生成的SO文件进行测试"
          ls -lh *.so
          exit 1
        fi
        
        # Create simple test
        echo "int main(){return 0;}" > test.c
        
        # Generate LLVM IR
        clang-17 -S -emit-llvm test.c -o test.ll
        
        # Copy configuration file
        cp ../compiler/Kotoamatsukami.config ./
        
        # Test plugin loading (should not crash)
        timeout 30s opt-17 --load-pass-plugin=./$SO_FILE \
          --passes=gv-encrypt -S test.ll -o test_out.ll || true
        
        # Check if output was created
        if [ -f test_out.ll ]; then
          echo "✅ Plugin loaded and executed successfully"
        else
          echo "⚠️ Plugin loading test inconclusive"
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kotoamatsukami-${{ matrix.arch }}
        path: |
          build-*/*.so
        retention-days: 30

    - name: Create release artifacts
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        mkdir -p release
        if [ "${{ matrix.arch }}" = "x86_64" ]; then
          cd build-x86_64
          SO_FILE=$(ls *.so | head -n1)
          cp $SO_FILE ../release/Kotoamatsukami-x86_64.so
          cd ..
        else
          cd build-arm64
          SO_FILE=$(ls *.so | head -n1)
          cp $SO_FILE ../release/Kotoamatsukami-arm64.so
          cd ..
        fi

    - name: Upload release artifacts
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: kotoamatsukami-release-${{ matrix.arch }}
        path: release/

  # 创建发布版本
  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          kotoamatsukami-release-x86_64/Kotoamatsukami-x86_64.so
          kotoamatsukami-release-arm64/Kotoamatsukami-arm64.so
        body: |
          ## Kotoamatsukami LLVM Pass Release
          
          This release includes pre-built LLVM Pass plugins for multiple architectures:
          
          - `Kotoamatsukami-x86_64.so` - For x86_64 systems
          - `Kotoamatsukami-arm64.so` - For ARM64/AArch64 systems (Android development)
          
          ### Usage
          ```bash
          # For x86_64
          opt-17 --load-pass-plugin=./Kotoamatsukami-x86_64.so --passes=gv-encrypt,flatten input.ll -S -o output.ll
          
          # For ARM64 (cross-compilation)
          opt-17 --load-pass-plugin=./Kotoamatsukami-arm64.so --passes=gv-encrypt,flatten input_arm64.ll -S -o output_arm64.ll
          ```
          
          ### Supported Obfuscation Passes
          - gv-encrypt: Global variable encryption
          - bogus-control-flow: Bogus control flow
          - flatten: Control flow flattening
          - split-basic-block: Basic block splitting
          - substitution: Instruction substitution
          - add-junk-code: Junk code insertion
          - And more...
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
